name: Deploy KrishiAtlas to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Content & Schema
        run: python scripts/validate_content.py

      - name: Check Duplicates
        run: python scripts/check_duplicates.py

      - name: Check Internal Links & Sources
        run: python scripts/check_links.py

      - name: Privacy & Credentials Audit
        run: python scripts/privacy_audit.py

      - name: Compile Master Compendium
        run: python scripts/build_book.py

      - name: Run Book Acceptance Tests
        run: python scripts/test_book.py

      - name: Build Search Index
        run: python scripts/build_search.py

      - name: Build Static Site Database
        run: python scripts/build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
